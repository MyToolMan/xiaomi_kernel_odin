<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ODIN Tuner</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 20px; background: #111318; color: #eef1f7; }
    main { max-width: 760px; margin: auto; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .muted { color: #9da6b8; }
    .status { margin: 18px 0; padding: 14px; border-radius: 14px; background: #1c2029; }
    .error { color: #ff9d9d; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #303542; }
    th { background: #202530; color: #b9c2d4; }
  </style>
</head>
<body>
<main>
  <h1>ODIN Tuner</h1>
  <div class="muted">SukiSU WebUI · 只读快照</div>
  <div id="status" class="status">正在读取 daemon 快照…</div>
  <h2>CPU</h2>
  <table><thead><tr><th>CPU</th><th>当前 MHz</th><th>上限 MHz</th><th>Governor</th></tr></thead><tbody id="cpu"></tbody></table>
  <h2>GPU / 温度</h2>
  <div id="summary" class="status">无数据</div>
</main>
<script>
const statusEl = document.querySelector('#status');
const cpuEl = document.querySelector('#cpu');
const summaryEl = document.querySelector('#summary');

function exec(command) {
  return new Promise((resolve, reject) => {
    const callback = `odin_cb_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    window[callback] = (errno, stdout, stderr) => {
      delete window[callback];
      if (errno === 0) resolve(stdout);
      else reject(new Error(stderr || `exit ${errno}`));
    };
    try {
      ksu.exec(command, '{}', callback);
    } catch (error) {
      delete window[callback];
      reject(error);
    }
  });
}

function cell(value) {
  const td = document.createElement('td');
  td.textContent = value ?? '—';
  return td;
}

async function refresh() {
  try {
    const output = await exec('cat /data/adb/odin-tuner/snapshot.json');
    const data = JSON.parse(output);
    statusEl.textContent = `快照 ${data.generated_at} · 最高温 ${data.max_temp_c ?? '—'} °C`;
    statusEl.className = 'status';
    cpuEl.replaceChildren(...(data.cpu || []).map(cpu => {
      const tr = document.createElement('tr');
      tr.append(cell(cpu.cpu), cell(cpu.current_mhz), cell(cpu.max_mhz), cell(cpu.governor));
      return tr;
    }));
    summaryEl.textContent = data.gpu
      ? `GPU ${data.gpu.current_mhz} MHz / 上限 ${data.gpu.max_mhz} MHz`
      : `GPU 不可用：${data.gpu_error || 'unknown'}`;
  } catch (error) {
    statusEl.textContent = `读取失败：${error.message}`;
    statusEl.className = 'status error';
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
