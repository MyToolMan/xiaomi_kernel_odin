<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ODIN Tuner</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 20px; background: #111318; color: #eef1f7; }
    main { max-width: 760px; margin: auto; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .muted { color: #9da6b8; }
    .status { margin: 18px 0; padding: 14px; border-radius: 14px; background: #1c2029; }
    .error { color: #ff9d9d; }
    #web-status { white-space: pre-wrap; word-break: break-all; }
    button { border: 0; border-radius: 12px; padding: 12px 16px; background: #78b7ff; color: #08111e; font-weight: 700; }
    button.secondary { margin-left: 8px; background: #344257; color: var(--text); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #303542; }
    th { background: #202530; color: #b9c2d4; }
  </style>
</head>
<body>
<main>
  <h1>ODIN Tuner</h1>
  <div class="muted">SukiSU WebUI · 只读快照</div>
  <div id="status" class="status">正在读取 daemon 快照…</div>
  <button id="start-web" type="button">重启 Web 服务</button>
  <button id="stop-web" class="secondary" type="button">停止浏览器服务</button>
  <div id="web-status" class="status">浏览器服务未启动</div>
  <h2>CPU</h2>
  <table><thead><tr><th>CPU</th><th>当前 MHz</th><th>上限 MHz</th><th>Governor</th></tr></thead><tbody id="cpu"></tbody></table>
  <h2>GPU / 温度</h2>
  <div id="summary" class="status">无数据</div>
</main>
<script>
const statusEl = document.querySelector('#status');
const cpuEl = document.querySelector('#cpu');
const summaryEl = document.querySelector('#summary');
const startWebEl = document.querySelector('#start-web');
const stopWebEl = document.querySelector('#stop-web');
const webStatusEl = document.querySelector('#web-status');

function exec(command) {
  return new Promise((resolve, reject) => {
    const callback = `odin_cb_${Date.now()}_${Math.random().toString(16).slice(2)}`;
    window[callback] = (errno, stdout, stderr) => {
      delete window[callback];
      if (errno === 0) resolve(stdout);
      else reject(new Error(stderr || `exit ${errno}`));
    };
    try {
      ksu.exec(command, '{}', callback);
    } catch (error) {
      delete window[callback];
      reject(error);
    }
  });
}

function cell(value) {
  const td = document.createElement('td');
  td.textContent = value ?? '—';
  return td;
}

async function refresh() {
  try {
    const output = await exec('cat /data/adb/odin-tuner/snapshot.json');
    const data = JSON.parse(output);
    statusEl.textContent = `快照 ${data.generated_at} · 最高温 ${data.max_temp_c ?? '—'} °C`;
    statusEl.className = 'status';
    cpuEl.replaceChildren(...(data.cpu || []).map(cpu => {
      const tr = document.createElement('tr');
      tr.append(cell(cpu.cpu), cell(cpu.current_mhz), cell(cpu.max_mhz), cell(cpu.governor));
      return tr;
    }));
    summaryEl.textContent = data.gpu
      ? `GPU ${data.gpu.current_mhz} MHz / 上限 ${data.gpu.max_mhz} MHz`
      : `GPU 不可用：${data.gpu_error || 'unknown'}`;
  } catch (error) {
    statusEl.textContent = `读取失败：${error.message}`;
    statusEl.className = 'status error';
  }
}

startWebEl.addEventListener('click', async () => {
  startWebEl.disabled = true;
  webStatusEl.textContent = '正在启动…';
  try {
    const output = await exec('/data/adb/modules/odin-tuner/bin/restart-web.sh');
    webStatusEl.textContent = output.trim() || 'Web 服务已重启：http://127.0.0.1:8787';
  } catch (error) {
    webStatusEl.textContent = `重启失败：${error.message}`;
  } finally {
    startWebEl.disabled = false;
  }
});

stopWebEl.addEventListener('click', async () => {
  stopWebEl.disabled = true;
  try {
    const output = await exec('/data/adb/modules/odin-tuner/bin/stop-web.sh');
    webStatusEl.textContent = output.trim() || '浏览器服务已停止';
  } catch (error) {
    webStatusEl.textContent = `停止失败：${error.message}`;
  } finally {
    stopWebEl.disabled = false;
  }
});

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
